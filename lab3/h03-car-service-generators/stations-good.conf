# Every kind of car has a station. The stats must match stats.json.
input       = cars.txt
serve.every = 5

log.level   = INFO
log.sinks   = console, file
log.file    = stations.log
log.format  = pattern
log.pattern = [%l] %n: %m

#                 fuel      restaurant  queue     capacity
station.north   = ELECTRIC  PEOPLE      circular  8
station.south   = ELECTRIC  ROBOTS      linked
station.express = GAS       NONE        circular  4
station.east    = GAS       PEOPLE      linked
station.west    = GAS       ROBOTS      circular  8
